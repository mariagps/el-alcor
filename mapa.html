      position: relative;
      max-width: 900px;
      margin: .5rem auto 1.5rem;

    .map-wrap img {
      width: 100%; display: block;

    }

    .marker {
      position: absolute;
      width: 22px; height: 22px;
      background: #2d5016;
      border: 2px solid rgba(255,255,255,.85);
      border-radius: 50%;
      color: #fff;
      font-size: .6rem;
      font-weight: bold;
      font-family: monospace;
      display: flex; align-items: center; justify-content: center;
      transform: translate(-50%, -50%);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,.45);
      z-index: 10;
      transition: background .15s, transform .15s;
    }
    .marker:hover {
      background: #6aaa3a;
      transform: translate(-50%, -50%) scale(1.3);
      z-index: 20;
    }
    .marker.active {
      background: #f5c842;
      border-color: #2d5016;
      color: #2d5016;
      transform: translate(-50%, -50%) scale(1.3);
      z-index: 20;
    }

    /* Tooltip */
    .tip {
      display: none;
      position: absolute;
      bottom: 26px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.82);
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: .68rem;
      white-space: nowrap;
      pointer-events: none;
    }
    .marker:hover .tip { display: block; }

    /* Side panel */
    #panel {
      display: none;
      max-width: 900px; margin: 0 auto 1rem; padding: 0 1rem;
    }
    #panel .panel-inner {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
      overflow: hidden;
      display: flex; gap: 0;
    }
    .panel-photos {
      display: flex; gap: 2px;
      width: 260px; min-width: 260px;
      height: 160px; background: #eee;
      flex-shrink: 0;
    }
    .panel-photos img {
      flex: 1; object-fit: cover; cursor: pointer;
      transition: flex .2s;
    }
    .panel-photos img:hover { flex: 2; }
    .panel-body { padding: .9rem 1.1rem; flex: 1; }
    .panel-body h2 { font-size: 1rem; color: #2d5016; text-transform: uppercase; letter-spacing: .03em; }
    .panel-sci { font-style: italic; font-size: .8rem; color: #888; margin: .1rem 0 .5rem; }
    .panel-desc { font-size: .83rem; line-height: 1.5; color: #444; margin-bottom: .5rem; }
    .panel-care {
      background: #f2f7ec; border-left: 3px solid #6aaa3a;
      padding: .4rem .7rem; border-radius: 0 4px 4px 0;
      font-size: .78rem; color: #555; line-height: 1.45;
    }
    .panel-care strong { display: block; font-size: .7rem; text-transform: uppercase;
      letter-spacing: .05em; color: #3d6b1f; margin-bottom: .2rem; }
    .panel-link {
      display: inline-block; margin-top: .6rem;
      font-size: .78rem; color: #3d6b1f; text-decoration: none;
      border-bottom: 1px dotted #6aaa3a;
    }
    .panel-link:hover { color: #2d5016; }
    .panel-close {
      position: absolute; top: .5rem; right: .7rem;
      font-size: 1.1rem; cursor: pointer; color: #aaa; line-height: 1;
    }
    .panel-close:hover { color: #333; }

    /* Legend */
    .legend {
      max-width: 900px; margin: 0 auto 3rem; padding: 0 1rem;
    }
    .legend h2 { font-size: .9rem; color: #2d5016; text-transform: uppercase;
      letter-spacing: .04em; margin-bottom: .6rem; font-weight: normal; }
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: .3rem;
    }
    .legend-item {
      display: flex; align-items: center; gap: .45rem;
      font-size: .8rem; padding: .25rem .4rem;
      border-radius: 4px; cursor: pointer; transition: background .15s;
    }
    .legend-item:hover { background: #e8f0dc; }
    .legend-num {
      width: 20px; height: 20px; border-radius: 50%;
      background: #2d5016; color: #fff;
      font-size: .6rem; font-weight: bold; font-family: monospace;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    #lightbox.open { display: flex; }
    #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 4px; }
    #lb-close { position: absolute; top: 1rem; right: 1.2rem;
      color: #fff; font-size: 2rem; cursor: pointer; }

// Build plant index for legend (unique slugs in order of first appearance)
const seen = new Set();
const uniquePlants = [];
rawMarkers.forEach(m => { if (!seen.has(m.slug)) { seen.add(m.slug); uniquePlants.push(m); } });
uniquePlants.sort((a,b) => a.slug.localeCompare(b.slug));

// Place markers
const wrap = document.getElementById('mapwrap');
let activeMarker = null;

rawMarkers.forEach((m, i) => {
  const div = document.createElement('div');
  div.className = 'marker';
  div.style.left = m.x + '%';
  div.style.top = m.y + '%';
  const num = m.slug.split('-')[0].replace(/^0/,'');
  div.innerHTML = `${num}<span class="tip">${m.name}</span>`;
  div.addEventListener('click', e => {
    e.stopPropagation();
    if (activeMarker) activeMarker.classList.remove('active');
    div.classList.add('active');
    activeMarker = div;
    mostrarPanel(m.slug);
  });
  wrap.appendChild(div);
});

// Legend
const lgrid = document.getElementById('legend-grid');
uniquePlants.forEach(m => {
  const div = document.createElement('div');
  div.className = 'legend-item';
  const num = m.slug.split('-')[0].replace(/^0/,'');
  div.innerHTML = `<span class="legend-num">${num}</span><span>${m.name}</span>`;
  div.addEventListener('click', () => mostrarPanel(m.slug));
  lgrid.appendChild(div);
});

function mostrarPanel(slug) {
  const p = plantData[slug];
  if (!p) return;
  const pi = parseInt(slug.split('-')[0]) - 1;
  document.getElementById('panel-name').textContent = rawMarkers.find(m=>m.slug===slug).name;
  document.getElementById('panel-sci').textContent = p.scientific;
  document.getElementById('panel-desc').textContent = p.desc;
  document.getElementById('panel-care').textContent = p.care;
  document.getElementById('panel-link').href = `index.html#plant-${pi}`;
  const photos = document.getElementById('panel-photos');
  photos.innerHTML = p.photos.map(src =>
    `<img src="${src}" alt="" onclick="openLb('${src}')">`
  ).join('');
  document.getElementById('panel').style.display = 'block';
  document.getElementById('panel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function cerrarPanel() {
  document.getElementById('panel').style.display = 'none';
  if (activeMarker) { activeMarker.classList.remove('active'); activeMarker = null; }
}

document.addEventListener('click', e => {
  if (!e.target.closest('#panel') && !e.target.closest('.marker')) cerrarPanel();
});

function openLb(src) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLb() {
  document.getElementById('lightbox').classList.remove('open');
}
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeLb();
});
document.addEventListener('keydown', e => { if (e.key==='Escape') closeLb(); });
</script>
