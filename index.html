// Build nav
const nav = document.getElementById('nav-links');
plants.forEach((p, i) => {
  const a = document.createElement('a');
  a.href = `#plant-${i}`;
  a.textContent = p.name.split('/')[0].trim();
  nav.appendChild(a);
});

// Build grid
const grid = document.getElementById('grid');
plants.forEach((p, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = `plant-${i}`;
  card.dataset.name = p.name.toLowerCase();

  const photoLabels = ['Vista general', 'Hojas', 'Tronco'];
  let photosHtml = '';
  if (p.photos.length > 0) {
    p.photos.forEach((id, pi) => {
      photosHtml += `<img src="${DRIVE(id)}" alt="${photoLabels[pi] || 'Detalle'}" title="${photoLabels[pi] || 'Detalle'}" onclick="openLightbox('${DRIVE(id)}')">`;
    });
  } else {
    photosHtml = '<div class="no-photo">Fotos próximamente</div>';
  }

  card.innerHTML = `
    <div class="photos">${photosHtml}</div>
    <div class="card-body">
      <h2>${p.name}</h2>
      <div class="scientific">${p.scientific}</div>
      <p class="description">${p.desc}</p>
      <div class="care">
        <div class="care-title">Cuidados</div>
        <p>${p.care}</p>
      </div>
    </div>
  `;
  grid.appendChild(card);
});

updateStats();

function filterCards() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('hidden', !c.dataset.name.includes(q));
  });
  updateStats();
}

function updateStats() {
  const total = plants.length;
  const visible = document.querySelectorAll('.card:not(.hidden)').length;
  const withPhotos = plants.filter(p => p.photos.length > 0).length;
  document.getElementById('stats').textContent =
    visible === total
      ? `${total} especies · ${withPhotos} con fotografías`
      : `${visible} de ${total} especies`;
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeLightbox();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
